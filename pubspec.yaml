name: self_accountant
description: "TakaFlow - Offline-first smart personal finance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Database & Storage
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Utilities & Formatting
  intl: ^0.20.3
  crypto: ^3.0.6
  csv: ^6.0.0
  share_plus: ^10.1.3

  # Hardware & Audio
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0

  # Charts & Visuals
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/seed/
